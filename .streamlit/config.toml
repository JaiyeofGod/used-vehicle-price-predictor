[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#f7f5f0"
secondaryBackgroundColor = "#ffffff"
textColor = "#191c1e"
borderColor = "#c3c6d7"
linkColor = "#004ac6"
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseFontSize = 14
headingFontSizes = ["30px", "20px", "16px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = false
metricValueFontSize = "48px"
blueColor = "#2563eb"

[client]
toolbarMode = "minimal"
